<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>節電鯖 宝くじ</title>
<link rel="preconnect" href="https://hfcnvdplnqqbrzpttpqy.supabase.co">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f4f2; --panel:#ffffff; --panel2:#fafafa;
  --line:#cfcfcf; --line2:#e2e2e2;
  --txt:#222222; --sub:#666666;
  --acc:#1d6fb8; --accbg:#e9f1f8;
  --danger:#b03a2e; --radius:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;margin:0;color:var(--txt);background:var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
header .row{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:19px;font-weight:800;color:var(--txt)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{color:var(--txt);text-decoration:none;padding:7px 11px;border-radius:6px;background:#fff;border:1px solid #c9c9c9;font-size:14px}
nav a:hover{border-color:var(--acc);color:var(--acc)}
nav a.on{background:var(--acc);color:#fff;font-weight:700;border-color:var(--acc)}
nav button{padding:7px 11px}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--panel);border:1px solid #d9d9d9;border-radius:var(--radius);padding:18px;margin:14px 0}
.card.glow{border:2px solid #888}
h2{margin:4px 0 10px;font-size:22px;font-weight:800} h3{margin:6px 0 8px;font-size:16px}
.hint{color:var(--sub);font-size:13px;margin:4px 0 10px;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px;font-weight:600}
input,select,textarea{width:100%;background:#fff;color:var(--txt);border:1px solid #b5b5b5;border-radius:6px;padding:11px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(29,111,184,.35);border-color:var(--acc)}
button,.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:6px;padding:10px 16px;cursor:pointer;font-size:15px;font-weight:700;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#185d9c}
button.big{width:100%;padding:14px;font-size:16px;margin-top:14px}
button.danger{background:var(--danger);border-color:var(--danger)}
button.danger:hover{background:#933025}
button.sub,.btn.sub{background:#fff;border:1px solid #b5b5b5;color:var(--txt);font-weight:600}
button.sub:hover,.btn.sub:hover{border-color:var(--acc);color:var(--acc);background:#fff}
button:disabled{opacity:.45;cursor:default}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line2);padding:8px;text-align:left}
th{color:var(--sub);font-weight:600}
.err{background:#fbeeed;border:1px solid #d8a7a3;color:#7c231c;padding:11px 13px;border-radius:6px;margin:10px 0}
.ok{background:#edf5ee;border:1px solid #a9c6ad;color:#21512a;padding:11px 13px;border-radius:6px;margin:10px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi .box{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:12px}
.kpi .box span{color:var(--sub);font-size:12px;display:block;margin-bottom:3px}
.kpi .box b{font-size:21px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.cell{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:10px;text-align:center}
.cell.hot{border-color:#999}
.cell.win{border:2px solid var(--acc);background:var(--accbg)}
.num{font-size:20px;font-weight:800}
.small{font-size:12px;color:var(--sub)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.seg button{background:#fff;border:1px solid #b5b5b5;color:var(--txt);font-weight:600;padding:11px 15px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:8px}
.pick button{position:relative;background:#fff;border:1px solid #b5b5b5;color:var(--txt);padding:11px 2px;border-radius:6px;font-weight:700;font-size:17px}
.pick button small{display:block;font-weight:500;color:var(--sub);font-size:11px;margin-top:2px}
.pick button.sel{background:var(--accbg);border-color:var(--acc)}
.pick button .cnt{position:absolute;top:-8px;right:-6px;background:#333;color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;font-weight:800}
.pick.minus button.sel{background:#fbeeed;border-color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #c9c9c9;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;margin:3px 4px 3px 0}
.chip input{width:auto}
.qchip{background:#fff;border:1px solid #b5b5b5;color:var(--txt);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;margin:2px 3px;font-weight:600}
.selchip{background:#333;color:#fff;border:1px solid #333;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;margin:2px 3px}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper button{padding:9px 14px}
.stepper input{width:90px;text-align:center}
.badge{display:inline-block;background:#f0f0f0;border:1px solid #c9c9c9;border-radius:999px;padding:3px 11px;font-size:12px;color:var(--sub)}
.balls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ball{min-width:54px;height:54px;padding:0 10px;border:2px solid #333;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--txt)}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 14px}
.stickybar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.stickybar .sum{font-size:15px;white-space:nowrap}
.stickybar button{flex:1;padding:13px;font-size:16px}
.scroll{overflow-x:auto}
.tabbar{display:none}
.bookpage{width:100%;min-height:150px;font-family:ui-monospace,monospace;font-size:14px;line-height:1.5;white-space:pre-wrap}
@media (max-width:860px){
  header nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;text-align:center;color:var(--sub);text-decoration:none;font-size:12px;padding:8px 0;border-radius:6px}
  .tabbar a .ic{display:none}
  .tabbar a.on{color:var(--acc);background:var(--accbg);font-weight:700}
  main{padding-bottom:120px}
  .stickybar{bottom:56px}
  .pick{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}
  .pick button{padding:14px 2px;font-size:18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  button,.btn{padding:12px 16px}
  th,td{padding:9px 7px}
}
.hero{padding:18px;background:#fff;border:1px solid #d9d9d9;border-radius:var(--radius);margin:14px 0}
.hero .big{font-size:24px;font-weight:800}
@media (max-width:640px){ .ball{min-width:48px;height:48px;font-size:20px} main{padding:14px 12px 110px} }
</style>
</head>
<body>
<header><div class="row"><span class="logo">節電鯖 宝くじ</span><nav id="nav"></nav></div></header>
<main id="main"></main>
<div id="tabbar" class="tabbar"></div>
<script>
const SUPABASE_URL = "https://hfcnvdplnqqbrzpttpqy.supabase.co";
const SUPABASE_KEY = "sb_publishable_Zdf-FwE0uoRDLvxwLIGxRQ_Ut56VGhB";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const VALID_NUMBERS = Array.from({length: 89}, (_, i) => i + 11).filter(n => n % 10 !== 0);
const STATUS_JP = {preparing: "準備中", selling: "販売中", closed: "販売おわり", drawn: "抽選ずみ", finished: "終了"};
const SOURCE_JP = {face: "対面", vending: "自販機", donation: "寄付の引換", sponsor: "スポンサー"};
const $main = document.getElementById("main");
const $nav = document.getElementById("nav");
let session = null, profile = null, currentRound = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
function addDays(iso, d) { const t = new Date(iso + "T00:00:00"); t.setDate(t.getDate() + d); return t.toISOString().slice(0, 10); }
function addMonths(iso, m) { const t = new Date(iso + "T00:00:00"); const day = t.getDate(); t.setMonth(t.getMonth() + m); if (t.getDate() < day) t.setDate(0); return t.toISOString().slice(0, 10); }
function msg(html, ok = true) { return html ? `<div class="${ok ? "ok" : "err"}">${html}</div>` : ""; }
async function audit(action, detail) { invalidateCache(); if (profile) await sb.from("audit").insert({actor: profile.username, action, detail}); }

// 計算ルール（サーバ版と同じ）
const prizeFund = (total, price, rate = 100) => Math.floor(total * price * rate / 100);
const poolPerNumber = (total, price, winCount, rate = 100) => winCount > 0 ? Math.floor(prizeFund(total, price, rate) / winCount) : 0;
const payoutPerTicket = (total, price, winCount, cnt, rate = 100) => cnt > 0 ? Math.floor(poolPerNumber(total, price, winCount, rate) / cnt) : 0;
function secureRandomInt(max) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max; }
function drawNumbers(soldNumbers, winCount) {
  if (!soldNumbers.length) throw new Error("売れた番号がまだありません");
  const sorted = [...soldNumbers].sort((a, b) => a - b);
  return Array.from({length: winCount}, () => sorted[secureRandomInt(sorted.length)]);
}
function formatWinning(winList) {
  return [...new Set(winList)].sort((a, b) => a - b).map(n => { const c = winList.filter(x => x === n).length; return c > 1 ? `${n} ×${c}` : `${n}`; }).join(" ・ ");
}
function redemptionFee(gross, isSponsor, today, rnd) {
  const freeUntil = rnd.redeem_free_until || "9999-12-31";
  const extUntil = rnd.redeem_ext_until || freeUntil;
  const sponsorUntil = rnd.sponsor_redeem_until || extUntil;
  if (today <= freeUntil) return 0;
  if (isSponsor && today <= sponsorUntil) return 0;
  if (today <= extUntil) return Math.floor(gross * 10 / 100);
  return null;
}

// データ取得（短時間キャッシュで体感速度アップ。書き込み後は invalidateCache() で消す）
const _cache = {rounds: null, roundsAt: 0, tickets: {}};
const CACHE_MS = 20000;
function invalidateCache(roundId) { _cache.rounds = null; if (roundId) delete _cache.tickets[roundId]; else _cache.tickets = {}; }
async function fetchRounds(force = false) {
  if (!force && _cache.rounds && Date.now() - _cache.roundsAt < CACHE_MS) return _cache.rounds;
  const {data, error} = await sb.from("rounds").select("*").order("id", {ascending: false}); if (error) throw error;
  _cache.rounds = data; _cache.roundsAt = Date.now(); return data;
}
async function fetchTickets(roundId, force = false) {
  const c = _cache.tickets[roundId];
  if (!force && c && Date.now() - c.at < CACHE_MS) return c.data;
  const {data, error} = await sb.from("tickets").select("*").eq("round_id", roundId).order("id"); if (error) throw error;
  _cache.tickets[roundId] = {data, at: Date.now()}; return data;
}
function payBreakdown(tickets) { // 有効な券の実売上を通貨別に集計（pay_currency が無い行はダイヤ扱い）
  let d = 0, mm = 0;
  for (const t of tickets) { if (t.status !== "valid") continue; if (t.pay_currency === "MM") mm += t.amount_paid || 0; else d += t.amount_paid || 0; }
  return {d, mm};
}
function statsFromTickets(tickets) {
  const counts = {};
  for (const t of tickets) if (t.status === "valid") counts[t.number] = (counts[t.number] || 0) + 1;
  return {counts, total: Object.values(counts).reduce((a, b) => a + b, 0)};
}
function computeWinners(tickets, rnd) {
  const winList = rnd.winning_numbers || [];
  if (!winList.length) return {};
  const {counts, total} = statsFromTickets(tickets);
  const mult = {}; winList.forEach(n => mult[n] = (mult[n] || 0) + 1);
  const per = {}; Object.keys(mult).forEach(n => per[n] = payoutPerTicket(total, rnd.price, rnd.win_count, counts[n] || 0, rnd.payout_rate));
  const result = {};
  for (const t of tickets) {
    if (t.status !== "valid") continue;
    const b = result[t.buyer] ||= {winTickets: [], gross: 0, paidTotal: 0, isSponsor: false, ticketsTotal: 0};
    b.ticketsTotal++; b.paidTotal += t.amount_paid;
    if (t.source === "sponsor" || t.source === "donation") b.isSponsor = true;
    if (mult[t.number]) { b.winTickets.push(t.number); b.gross += per[t.number] * mult[t.number]; }
  }
  return Object.fromEntries(Object.entries(result).filter(([, v]) => v.winTickets.length));
}

// ナビ
function renderNav() {
  const hRaw = (location.hash || "#public").slice(1);
  const h = hRaw.startsWith("trade-") ? "trade" : hRaw;
  const link = (hash, label) => `<a href="#${hash}" class="${h === hash ? "on" : ""}">${label}</a>`;
  if (!session) $nav.innerHTML = link("public", "みんなの実績") + link("claim", "自販機で買った方") + link("trade", "MM取引") + link("login", "販売員ログイン");
  else if (!profile || !profile.active) $nav.innerHTML = `<span class="badge">${esc(profile?.username || "")}：有効化まち</span><button class="sub" onclick="logout()">ログアウト</button>`;
  else $nav.innerHTML = link("app", "ホーム") + link("sell", "売る") + link("lots", "自販機") + link("donations", "寄付") + link("numbers", "番号一覧") + link("winners", "当選・引換") + link("manage", "券の管理") + link("book", "本") + link("proposals", "提案") + link("mm", "MM") + link("trade", "MM取引")
    + (profile.role === "admin" ? link("rounds", "回・設定") + link("users", "販売員") + link("audit", "記録") : "")
    + `<span class="badge">${esc(profile.username)}</span><button class="sub" onclick="logout()">ログアウト</button>`;
}
function renderTabbar() {
  const hRaw = (location.hash || "#public").slice(1);
  const h = hRaw.startsWith("trade-") ? "trade" : hRaw;
  const tab = (hash, ic, label) => `<a href="#${hash}" class="${h === hash ? "on" : ""}"><span class="ic">${ic}</span>${label}</a>`;
  const el = document.getElementById("tabbar");
  if (!session) el.innerHTML = tab("public", "", "実績") + tab("claim", "", "自販機") + tab("trade", "", "取引") + tab("login", "", "ログイン");
  else if (!profile || !profile.active) el.innerHTML = tab("public", "", "実績") + tab("claim", "", "自販機");
  else el.innerHTML = tab("app", "", "ホーム") + tab("sell", "", "売る") + tab("lots", "", "自販機") + tab("winners", "", "当選") + tab("book", "", "本") + tab("proposals", "", "提案") + tab("mm", "", "MM") + tab("more", "", "その他");
}
async function logout() { await sb.auth.signOut(); session = null; profile = null; location.hash = "#public"; render(); }

// 公開ページ（名前は出ません）
async function viewPublic() {
  $main.innerHTML = "<p>読み込み中…</p>";
  let mmPub = null;
  try { const {data} = await sb.from("mm_public").select("*").eq("id", 1).maybeSingle(); mmPub = data || null; } catch { mmPub = null; }
  const mmSection = mmPub ? `<div class="card"><h3>めうまねー (MM)</h3>
  <p class="hint">節電鯖の独自通貨です。1MM = ダイヤ1個で、いつでも両替できます。台帳はハッシュチェーンで記録されていて、後から書き換えると検出できます。</p>
  <div class="kpi">
    <div class="box"><span>流通中の MM</span><b>${mmPub.circulating} MM</b></div>
    <div class="box"><span>裏付けのダイヤ（全自販機）</span><b>${mmPub.dia_total} D</b></div>
    <div class="box"><span>台帳チェーン</span><b>${mmPub.chain_count} 件</b></div>
    <div class="box"><span>先端ハッシュ</span><b style="font-size:13px">${esc((mmPub.head_hash || "").slice(0, 16))}…</b></div>
    <div class="box"><span>この情報の更新</span><b style="font-size:13px">${fmtTime(mmPub.updated_at)}</b></div>
  </div></div>` : "";
  const {data: rounds} = await sb.from("public_rounds").select("*").order("id", {ascending: false});
  if (!rounds || !rounds.length) { $main.innerHTML = `<div class="card"><h2>宝くじ</h2><p>まだ始まっていません。まだ始まっていません。</p></div>` + mmSection; return; }
  const rnd = currentRound && rounds.find(r => r.id === currentRound) || rounds[0];
  currentRound = rnd.id;
  const {data: stats} = await sb.from("public_number_stats").select("*").eq("round_id", rnd.id);
  const counts = {}; let total = 0;
  (stats || []).forEach(s => { counts[s.number] = s.tickets; total += s.tickets; });
  const winList = rnd.winning_numbers || [];
  const picker = rounds.length > 1 ? `<div class="card">見たい回：<select onchange="currentRound=+this.value;viewPublic()">${rounds.map(r => `<option value="${r.id}" ${r.id === rnd.id ? "selected" : ""}>${esc(r.name)}（${STATUS_JP[r.status] || esc(r.status)}）</option>`).join("")}</select></div>` : "";
  let h = `<div class="hero"><div class="big">${esc(rnd.name)}</div><p class="hint" style="margin-bottom:0">1枚 ${rnd.price} D ／ 当選番号は ${rnd.win_count} 個 ／ 買った人の名前は公開されません</p></div>${picker}`;
  h += `<div class="card"><div class="kpi">
    <div class="box"><span>売れた枚数</span><b>${total} 枚</b></div>
    <div class="box"><span>集まった金額</span><b>${total * rnd.price} D</b></div>
    <div class="box"><span>1枚の値段</span><b>${rnd.price} D</b></div>
    <div class="box"><span>当たる確率（1枚）</span><b>${(rnd.win_count / 81 * 100).toFixed(1)}%</b></div>
    <div class="box"><span>いまの状態</span><b>${STATUS_JP[rnd.status] || esc(rnd.status)}</b></div></div></div>`;
  if (winList.length) h += `<div class="card glow"><h3>当選番号</h3><div class="balls">${[...winList].sort((a, b) => a - b).map(n => `<div class="ball">${n}</div>`).join("")}</div><p class="hint">同じ番号が2回出たら、配当も2回分もらえます。</p></div>`;
  const mult = {}; winList.forEach(n => mult[n] = (mult[n] || 0) + 1);
  const cells = VALID_NUMBERS.map(n => {
    const cnt = counts[n] || 0;
    const per = cnt ? payoutPerTicket(total, rnd.price, rnd.win_count, cnt, rnd.payout_rate) : 0;
    const cls = mult[n] ? "cell win" : (cnt ? "cell hot" : "cell");
    const label = mult[n] && cnt ? `当選。1枚 ${per * mult[n]}D` : (cnt ? `当たれば1枚 ${per}D` : "まだ売れてない");
    return `<div class="${cls}"><div class="num">${n}</div><div>${cnt} 枚</div><div class="small">${label}</div></div>`;
  }).join("");
  h += `<div class="card"><h3>番号ごとの売れ行き</h3><p class="hint">買った人の名前は公開されません。配当は「集まった金額 ÷ 当選番号の数 ÷ その番号を買った枚数」で決まります。</p><div class="grid">${cells}</div></div>`;
  h += mmSection;
  $main.innerHTML = h;
}

// 購入者入力（自販機）
function viewClaim(m = "", ok = true) {
  $main.innerHTML = msg(m, ok) + `<div class="card"><h2>自販機で買った方へ</h2>
  <p>券と一緒に入っていた紙に書かれた<b>「販売管理ID」</b>と、あなたの <b>Minecraft ID</b> を入れてください。それで券があなたのものとして登録されます。</p>
  <label class="f">あなたの Minecraft ID</label><input id="c_buyer" maxlength="32" placeholder="例: Steve_123">
  <label class="f">販売管理ID（紙に書かれた5けたの数字）</label><input id="c_code" maxlength="8" inputmode="numeric" placeholder="例: 12345">
  <p class="hint">入力を繰り返し間違えると、しばらく入力できなくなります。紙の記載を確認してから入力すること。</p>
  <button class="big" onclick="doClaim()">券を登録する</button></div>`;
}
async function doClaim() {
  const buyer = document.getElementById("c_buyer").value.trim();
  const code = document.getElementById("c_code").value.trim();
  const {data, error} = await sb.rpc("claim_lot", {p_buyer: buyer, p_sale_code: code});
  if (error) return viewClaim("通信エラーが発生しました。時間をおいて再度試してください。", false);
  if (data?.ok) return viewClaim(`登録が完了しました。あなたの番号: ${data.numbers.join(", ")}（${data.numbers.length}枚）`);
  const map = {locked: "間違いが続いたので、しばらく入力できません。販売員に声をかけてください。", bad_buyer: "Minecraft ID の書き方が違います。", not_found: "その販売管理IDは見つからないか、もう登録ずみです。"};
  viewClaim(map[data?.error] || "登録できませんでした。", false);
}

// ログイン・登録
function viewLogin(m = "", ok = true) {
  $main.innerHTML = msg(m, ok) + `<div class="card"><h2>販売員ログイン</h2>
  <label class="f">ユーザー名</label><input id="l_user" autocomplete="username">
  <label class="f">パスワード</label><input id="l_pass" type="password" autocomplete="current-password">

}
function viewRegister(m = "", ok = true) {
  $main.innerHTML = msg(m, ok) + `<div class="card"><h2>販売員アカウントを作る</h2>
  <label class="f">ユーザー名（半角の英数字と _ 、3〜32文字）</label><input id="r_user">
  <label class="f">パスワード（8文字以上）</label><input id="r_pass" type="password">
  <button class="big" onclick="doRegister()">登録する</button>
  <p class="hint">登録しただけでは使えません。管理者に有効化してもらってからログインしてください。</p></div>`;
}
const emailOf = u => `${u}@setsuden.local`;
async function doRegister() {
  const u = document.getElementById("r_user").value.trim();
  const p = document.getElementById("r_pass").value;
  if (!/^[A-Za-z0-9_]{3,32}$/.test(u)) return viewRegister("ユーザー名は半角の英数字と _ で、3〜32文字にしてください。", false);
  if (p.length < 8) return viewRegister("パスワードは8文字以上にしてください。", false);
  const {error} = await sb.auth.signUp({email: emailOf(u), password: p, options: {data: {username: u}}});
  if (error) return viewRegister("登録できませんでした: " + esc(error.message), false);
  await sb.auth.signOut();
  viewLogin(`登録しました。管理者に「${esc(u)} を有効化して」と伝えてください。`);
}
async function doLogin() {
  const u = document.getElementById("l_user").value.trim();
  const p = document.getElementById("l_pass").value;
  const {data, error} = await sb.auth.signInWithPassword({email: emailOf(u), password: p});
  if (error) return viewLogin("ユーザー名かパスワードが違います。", false);
  session = data.session;
  await loadProfile();
  location.hash = "#app"; render();
}
async function loadProfile() {
  if (!session) { profile = null; return; }
  const {data} = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  profile = data || null;
}
</script>
<script>
// ---- 内部共通 ----
function roundPicker(rounds, hash) {
  if (rounds.length <= 1) return "";
  return `<div class="card">いまの回：<select onchange="currentRound=+this.value;location.hash='${hash}';render()">${rounds.map(r => `<option value="${r.id}" ${r.id === currentRound ? "selected" : ""}>${esc(r.name)}（${STATUS_JP[r.status] || esc(r.status)}）</option>`).join("")}</select></div>`;
}
async function pickRound() {
  const rounds = await fetchRounds();
  if (!rounds.length) return {rounds, rnd: null};
  const rnd = rounds.find(r => r.id === currentRound) || rounds[0];
  currentRound = rnd.id;
  return {rounds, rnd};
}

// ---- ホーム ----
async function viewApp(m = "", ok = true) {
  const {rounds, rnd} = await pickRound();
  if (!rnd) { $main.innerHTML = msg(m, ok) + `<div class="card"><h2>ホーム</h2><p>まだ「回」が作られていません。${profile.role === "admin" ? `<a href="#rounds">最初の回を作る</a>` : "管理者に回を作ってもらってください。"}</p></div>`; return; }
  const [tickets, lotsRes, donsRes] = await Promise.all([
    fetchTickets(rnd.id),
    sb.from("lots").select("status,size").eq("round_id", rnd.id),
    sb.from("donations").select("amount_db,tickets_entitled,tickets_issued").eq("round_id", rnd.id)
  ]);
  const {total} = statsFromTickets(tickets);
  const lots = lotsRes.data;
  const stocked = (lots || []).filter(l => l.status === "stocked").length;
  const claimed = (lots || []).filter(l => l.status !== "stocked").length;
  const dons = donsRes.data;
  const donSum = (dons || []).reduce((a, d) => ({db: a.db + d.amount_db, rest: a.rest + (d.tickets_entitled - d.tickets_issued)}), {db: 0, rest: 0});
  let h = msg(m, ok) + `<h2>ホーム</h2>` + roundPicker(rounds, "#app");
  h += `<div class="card"><div class="kpi">
    <div class="box"><span>いまの回</span><b>${esc(rnd.name)}</b></div>
    <div class="box"><span>状態</span><b>${STATUS_JP[rnd.status] || esc(rnd.status)}</b></div>
    <div class="box"><span>売れた枚数</span><b>${total} 枚</b></div>
    <div class="box"><span>集まった金額</span><b>${total * rnd.price} D</b></div>
    <div class="box"><span>売上の内訳（実際に払われた分）</span><b>ダイヤ ${payBreakdown(tickets).d} / MM ${payBreakdown(tickets).mm}</b></div>
    <div class="box"><span>当選番号1つ分の配当のもと</span><b>${poolPerNumber(total, rnd.price, rnd.win_count, rnd.payout_rate)} D</b></div>
    <div class="box"><span>自販機ロット</span><b>在庫 ${stocked} / 登録ずみ ${claimed}</b></div>
    <div class="box"><span>寄付の合計</span><b>${donSum.db} DB</b></div>
    <div class="box"><span>寄付でもらえる券（残り）</span><b>${donSum.rest} 枚</b></div></div>
    <p><a class="btn" href="#sell">券を売る</a> <a class="btn sub" href="#winners">当選・引換へ</a></p></div>`;
  const recent = tickets.slice(-12).reverse();
  h += `<div class="card"><h3>最近の販売</h3><div class="scroll"><table><tr><th>買った人</th><th>番号</th><th>売り方</th><th>売った人</th><th>金額</th></tr>${recent.map(t => `<tr><td>${esc(t.buyer)}</td><td>${t.number}</td><td>${SOURCE_JP[t.source] || esc(t.source)}</td><td>${esc(t.seller)}</td><td>${t.amount_paid}D</td></tr>`).join("")}</table></div></div>`;
  $main.innerHTML = h;
}

// ---- 売る（タップで番号えらび） ----
let sellSel = {};        // {番号: 口数}
let sellSource = "face"; // face/sponsor/donation
let sellCurrency = "D";  // D / MM（1D = 1MM なので金額は同じ）
let sellCounts = {};     // 既に売れた枚数（表示用）
function sellTotal() { return Object.values(sellSel).reduce((a, b) => a + b, 0); }
function sellSummary(rnd) {
  const list = Object.entries(sellSel).sort((a, b) => a[0] - b[0]).map(([n, c]) => c > 1 ? `${n}×${c}` : `${n}`).join("、");
  return {list, total: sellTotal()};
}
async function viewSell(m = "", ok = true) {
  const {rounds, rnd} = await pickRound();
  if (!rnd) { $main.innerHTML = `<div class="card">回がありません。</div>`; return; }
  const [tickets, donsRes] = await Promise.all([fetchTickets(rnd.id), sb.from("donations").select("*").eq("round_id", rnd.id)]);
  sellCounts = statsFromTickets(tickets).counts;
  window._sellPrice = rnd.price;
  const recentBuyers = [...new Set(tickets.slice().reverse().map(t => t.buyer))].slice(0, 8);
  const dons = donsRes.data;
  const avail = (dons || []).filter(d => d.tickets_issued < d.tickets_entitled);
  const grid = VALID_NUMBERS.map(n => {
    const sel = sellSel[n] || 0;
    return `<button type="button" class="${sel ? "sel" : ""}" onclick="sellTap(${n})">${n}<small>売れた ${sellCounts[n] || 0}枚</small>${sel ? `<span class="cnt">${sel}口</span>` : ""}</button>`;
  }).join("");
  const seg = (v, label) => `<button type="button" class="${sellSource === v ? "on" : ""}" onclick="sellSource='${v}';viewSell()">${label}</button>`;
  $main.innerHTML = msg(m, ok) + roundPicker(rounds, "#sell") + `<div class="card"><h2>券を売る</h2>
  <p class="hint">${esc(rnd.name)} ／ 1枚 ${rnd.price} D ／ 状態: ${STATUS_JP[rnd.status] || esc(rnd.status)}${["preparing", "selling"].includes(rnd.status) ? "" : "（いまは売れません）"}</p>
  <label class="f">① 買う人の Minecraft ID</label><input id="s_buyer" maxlength="32" placeholder="例: Steve_123" value="${esc(window._sellBuyer || "")}" oninput="window._sellBuyer=this.value">
  ${recentBuyers.length ? `<div style="margin-top:6px">${recentBuyers.map(b => `<button type="button" class="qchip" onclick="setBuyer('${esc(b)}')">${esc(b)}</button>`).join("")}<span class="small">← 最近買った人（タップで入力）</span></div>` : ""}
  <label class="f">② 売り方</label>
  <div class="seg">${seg("face", "ふつうに売る")}${seg("sponsor", "スポンサー券")}${seg("donation", "寄付の引換で渡す")}</div>
  ${sellSource === "donation" ? `<label class="f">どの寄付の引換ですか</label><select id="s_donation"><option value="">選んでください</option>${avail.map(d => `<option value="${d.id}">${esc(d.donor)}（あと ${d.tickets_entitled - d.tickets_issued} 枚わたせる）</option>`).join("")}</select>` : ""}
  <label class="f">支払う通貨（1D = 1MM）</label>
  <div class="seg"><button type="button" class="${sellCurrency === "D" ? "on" : ""}" onclick="sellCurrency='D';viewSell()">ダイヤ</button><button type="button" class="${sellCurrency === "MM" ? "on" : ""}" onclick="sellCurrency='MM';viewSell()">MM（めうまねー）</button></div>
  <label class="f">③ 番号をタップで選ぶ</label>
  <div class="seg">
    <button type="button" id="mode_add" class="${sellMode === "add" ? "on" : ""}" onclick="setSellMode('add')">＋ ふやすモード</button>
    <button type="button" id="mode_minus" class="${sellMode === "minus" ? "on" : ""}" onclick="setSellMode('minus')">− へらすモード（間違えたとき）</button>
  </div>
  <div class="pick ${sellMode === "minus" ? "minus" : ""}" id="pick_grid">${grid}</div>
  <div id="sell_chips" style="margin-top:12px">${sellChipsHtml()}</div>
  <p id="sell_sum" style="margin-top:6px">${sellSummaryHtml()}</p>
  <div class="stepper"><span>おまかせで足す：</span><button type="button" onclick="stepOmakase(-1)">−</button><input id="s_omakase" type="number" value="10" min="1" max="200"><button type="button" onclick="stepOmakase(1)">＋</button><button type="button" class="sub" onclick="sellOmakase()">おまかせで追加</button></div>
  <p>
    <label class="chip"><input type="checkbox" id="s_benefit"> 寄付の特典としてタダで渡す</label>
    <label class="chip"><input type="checkbox" id="s_staff"> 自分（販売員）が買う${rnd.staff_discount ? "（1割引あり）" : "（割引はOFFの回です）"}</label>
  </p>
  <button class="sub" onclick="sellSel={};viewSell()">選び直す</button></div>
  <div class="stickybar"><div class="in"><span class="sum" id="bar_sum">${barSumHtml()}</span><button onclick="doSell()">この内容で販売する</button></div></div>`;
}
let sellMode = "add";
function setBuyer(b) { window._sellBuyer = b; const el = document.getElementById("s_buyer"); if (el) el.value = b; }
function setSellMode(md) {
  sellMode = md;
  document.getElementById("mode_add").className = md === "add" ? "on" : "";
  document.getElementById("mode_minus").className = md === "minus" ? "on" : "";
  const g = document.getElementById("pick_grid"); if (g) g.className = "pick" + (md === "minus" ? " minus" : "");
}
function sellChipsHtml() {
  const entries = Object.entries(sellSel).filter(([, c]) => c > 0).sort((a, b) => a[0] - b[0]);
  if (!entries.length) return `<span class="small">選んだ番号がここに出ます（チップをタップすると1口へります）</span>`;
  return entries.map(([n, c]) => `<button type="button" class="selchip" onclick="sellRemoveOne(${n})">${n}${c > 1 ? ` ×${c}` : ""}</button>`).join("");
}
function barSumHtml() {
  const total = sellTotal();
  return total ? `合計 <b>${total} 枚</b>・目安 <b>${total * (window._sellPrice || 10)} ${sellCurrency === "MM" ? "MM" : "D"}</b>` : "番号を選んでください";
}
function sellSummaryHtml() {
  const {list, total} = sellSummary(null);
  if (!total) return "まだ番号を選んでいません。";
  return `選んだ番号: <b>${esc(list)}</b>`;
}
function sellTap(n) {
  if (sellMode === "minus") { sellRemoveOne(n); return; }
  sellSel[n] = (sellSel[n] || 0) + 1; refreshSell();
}
function sellRemoveOne(n) {
  if (!sellSel[n]) return;
  sellSel[n]--; if (sellSel[n] <= 0) delete sellSel[n];
  refreshSell();
}
function stepOmakase(d) { const el = document.getElementById("s_omakase"); el.value = Math.max(1, Math.min(200, (parseInt(el.value || "10", 10) + d))); }
function refreshSell() { viewSellRefreshGridOnly(); }
function viewSellRefreshGridOnly() { // グリッドと合計だけ描き直す（入力中のIDを消さないため）
  document.querySelectorAll(".pick button").forEach(btn => {
    const n = parseInt(btn.textContent, 10);
    const sel = sellSel[n] || 0;
    btn.className = sel ? "sel" : "";
    btn.innerHTML = `${n}<small>売れた ${sellCounts[n] || 0}枚</small>${sel ? `<span class="cnt">${sel}口</span>` : ""}`;
    btn.setAttribute("onclick", `sellTap(${n})`);
  });
  const sum = document.getElementById("sell_sum"); if (sum) sum.innerHTML = sellSummaryHtml();
  const chips = document.getElementById("sell_chips"); if (chips) chips.innerHTML = sellChipsHtml();
  const bar = document.getElementById("bar_sum"); if (bar) bar.innerHTML = barSumHtml();
}
function sellOmakase() {
  const cnt = parseInt(document.getElementById("s_omakase").value || "0", 10);
  if (cnt <= 0) return;
  const pool = [...VALID_NUMBERS].sort((a, b) => ((sellCounts[a] || 0) + (sellSel[a] || 0)) - ((sellCounts[b] || 0) + (sellSel[b] || 0)) || secureRandomInt(1000) - 500);
  if (cnt <= 81) { for (let i = 0; i < cnt; i++) sellSel[pool[i % pool.length]] = (sellSel[pool[i % pool.length]] || 0) + 1; }
  else { for (let i = 0; i < cnt; i++) { const n = VALID_NUMBERS[secureRandomInt(81)]; sellSel[n] = (sellSel[n] || 0) + 1; } }
  refreshSell();
}
async function doSell() {
  try {
    const {rnd} = await pickRound();
    if (!["preparing", "selling"].includes(rnd.status)) throw new Error(`いまの状態（${STATUS_JP[rnd.status] || rnd.status}）では売れません`);
    const buyer = (window._sellBuyer || document.getElementById("s_buyer").value).trim();
    if (!/^[A-Za-z0-9_]{3,32}$/.test(buyer)) throw new Error("買う人の Minecraft ID を入れてください（半角の英数字と _ ）");
    const numbers = [];
    Object.entries(sellSel).forEach(([n, c]) => { for (let i = 0; i < c; i++) numbers.push(parseInt(n, 10)); });
    if (!numbers.length) throw new Error("番号をタップして選んでください");
    let don = null;
    if (sellSource === "donation") {
      const donId = document.getElementById("s_donation")?.value;
      if (!donId) throw new Error("どの寄付の引換か選んでください");
      const {data} = await sb.from("donations").select("*").eq("id", donId).single();
      don = data;
      if (don.tickets_issued + numbers.length > don.tickets_entitled) throw new Error(`${don.donor} さんに渡せるのはあと ${don.tickets_entitled - don.tickets_issued} 枚です`);
    }
    const benefit = document.getElementById("s_benefit").checked;
    let amountEach = rnd.price;
    if (benefit || sellSource === "donation") amountEach = 0;
    else if (sellSource === "sponsor") amountEach = 45;
    else if (document.getElementById("s_staff").checked && rnd.staff_discount) amountEach = rnd.price - Math.floor(rnd.price / 10);
    const rows = numbers.map(n => ({round_id: rnd.id, buyer, number: n, seller: profile.username, source: sellSource, donation_id: don?.id || null, is_donation_benefit: benefit, amount_paid: amountEach, pay_currency: sellCurrency}));
    const {error} = await sb.from("tickets").insert(rows); if (error) throw error;
    if (don) { const {error: e2} = await sb.from("donations").update({tickets_issued: don.tickets_issued + numbers.length}).eq("id", don.id); if (e2) throw e2; }
    await audit("sell", `round=${rnd.id} buyer=${buyer} numbers=${numbers} source=${sellSource} currency=${sellCurrency}`);
    const doneTotal = numbers.length, doneList = numbers.join(", ");
    sellSel = {}; window._sellBuyer = "";
    viewSell(`${esc(buyer)} さんに ${doneTotal} 枚売りました（番号: ${doneList}／金額の目安 ${amountEach * doneTotal}${sellCurrency === "MM" ? "MM" : "D"}）<br><a href="#book" onclick="window._bookKind='ticket';window._bookBuyer='${esc(buyer)}'">この人の「券の本」用テキストを作る</a>`);
  } catch (e) { viewSell(esc(e.message), false); }
}

// ---- 自販機ロット ----
async function viewLots(m = "", ok = true) {
  const {rounds, rnd} = await pickRound();
  if (!rnd) { $main.innerHTML = `<div class="card">回がありません。</div>`; return; }
  const {data: lots} = await sb.from("lots").select("*").eq("round_id", rnd.id).order("id", {ascending: false}).limit(200);
  const rows = (lots || []).map(l => `<tr><td><b>${esc(l.sale_code)}</b></td><td>${esc(l.machine_code)}</td><td>${l.size}枚</td><td>${esc((l.numbers || []).join(", "))}</td><td>${l.status === "stocked" ? "在庫" : "登録ずみ"}</td><td>${esc(l.buyer)}</td></tr>`).join("");
  $main.innerHTML = msg(m, ok) + roundPicker(rounds, "#lots") + `<div class="card"><h2>自販機に入れる券のセットを作る</h2>
  <p class="hint">作ると「番号のセット」と「販売管理ID」が出ます。販売管理IDを紙に書いて、券と一緒に自販機へ。買った人は公開ページでIDを入れて登録します。<b>販売管理IDは買う人に見せないで。</b></p>
  <label class="f">自販機の名前（場所）</label><input id="lot_machine" placeholder="例: 入口の自販機、L1 など">
  <label class="f">1セットの枚数</label>
  <div class="seg" id="lot_size_seg">${[5, 10, 20].map(s => `<button type="button" class="${s === 5 ? "on" : ""}" onclick="lotSizePick(this,${s})">${s}枚セット</button>`).join("")}</div>
  <label class="f">作るセット数</label>
  <div class="stepper"><button type="button" onclick="stepLot(-1)">−</button><input id="lot_count" type="number" value="1" min="1" max="50"><button type="button" onclick="stepLot(1)">＋</button></div>
  <button class="big" onclick="doLotsCreate()">セットを作る</button></div>
  <div class="card"><h3>買った人が自分で登録できなかったとき（代わりに入力）</h3>
  <label class="f">販売管理ID</label><input id="lot_code">
  <label class="f">買った人の Minecraft ID</label><input id="lot_buyer">
  <button class="sub" onclick="doLotsAssign()">代わりに登録する</button></div>
  <div class="card"><h3>作ったセット一覧</h3><div class="scroll"><table><tr><th>販売管理ID</th><th>自販機</th><th>枚数</th><th>番号</th><th>状態</th><th>買った人</th></tr>${rows}</table></div></div>`;
}
let _lotSize = 5;
function lotSizePick(el, s) { _lotSize = s; document.querySelectorAll("#lot_size_seg button").forEach(b => b.className = ""); el.className = "on"; }
function stepLot(d) { const el = document.getElementById("lot_count"); el.value = Math.max(1, Math.min(50, parseInt(el.value || "1", 10) + d)); }
async function doLotsCreate() {
  try {
    const {rnd} = await pickRound();
    const machine = document.getElementById("lot_machine").value.trim();
    const count = parseInt(document.getElementById("lot_count").value || "1", 10);
    if (!machine) throw new Error("自販機の名前を入れてください");
    const {data: existing} = await sb.from("lots").select("sale_code");
    const used = new Set((existing || []).map(l => l.sale_code));
    const rows = [], made = [];
    for (let i = 0; i < count; i++) {
      let code; do { code = String(10000 + secureRandomInt(90000)); } while (used.has(code)); used.add(code);
      const pool = [...VALID_NUMBERS]; const numbers = [];
      for (let k = 0; k < _lotSize; k++) numbers.push(pool.splice(secureRandomInt(pool.length), 1)[0]);
      numbers.sort((a, b) => a - b);
      rows.push({round_id: rnd.id, machine_code: machine, sale_code: code, size: _lotSize, numbers, created_by: profile.username});
      made.push(`ID ${code}: ${numbers.join(",")}`);
    }
    const {error} = await sb.from("lots").insert(rows); if (error) throw error;
    await audit("lot_create", `round=${rnd.id} ${made.join(" | ")}`);
    viewLots("セットを作りました → " + esc(made.join(" ／ ")));
  } catch (e) { viewLots(esc(e.message), false); }
}
async function doLotsAssign() {
  try {
    const code = document.getElementById("lot_code").value.trim();
    const buyer = document.getElementById("lot_buyer").value.trim();
    if (!/^[A-Za-z0-9_]{3,32}$/.test(buyer)) throw new Error("買った人の Minecraft ID を入れてください");
    const {data: lot} = await sb.from("lots").select("*").eq("sale_code", code).eq("status", "stocked").single();
    if (!lot) throw new Error("その販売管理IDのセットはないか、登録ずみです");
    const {rnd} = await pickRound();
    const rows = lot.numbers.map(n => ({round_id: lot.round_id, buyer, number: n, seller: profile.username, source: "vending", lot_id: lot.id, amount_paid: rnd.price}));
    const {error} = await sb.from("tickets").insert(rows); if (error) throw error;

async function viewNumbers() {

  for (const n of VALID_NUMBERS) {

async function viewWinners(m = "", ok = true) {
  const {rounds, rnd} = await pickRound();
  if (!rnd) { $main.innerHTML = `<div class="card">回がありません。</div>`; return; }
  let h = msg(m, ok) + roundPicker(rounds, "#winners");
  const winList = rnd.winning_numbers || [];
  if (profile.role === "admin" && !winList.length && ["closed", "selling", "preparing"].includes(rnd.status)) {
    h += `<div class="card"><h2>抽選する</h2><p class="hint">販売を終えてから押してください。売れた番号の中から ${rnd.win_count} 個を引きます。同じ番号が2回出ることもあって、そのときは配当も2回分です。</p><button class="danger big" onclick="doDraw()">抽選する</button></div>`;
  }
  if (!winList.length) { h += `<div class="card">まだ抽選していません。</div>`; $main.innerHTML = h; return; }
  h += `<div class="card glow"><h2>当選番号</h2><div class="balls">${[...winList].sort((a, b) => a - b).map(n => `<div class="ball">${n}</div>`).join("")}</div><p class="hint">抽選した日: ${esc((rnd.drawn_at || "").slice(0, 10))} ／ 抽選した人: ${esc(rnd.drawn_by || "")}</p>`;
  if (profile.role === "admin") h += `<button class="sub" onclick="doDrawReset()">抽選をや直す（取消）</button>`;
  h += `</div>`;
  const tickets = await fetchTickets(rnd.id);
  const winners = computeWinners(tickets, rnd);
  const {data: reds} = await sb.from("redemptions").select("*").eq("round_id", rnd.id);
  const redeemedBuyers = new Set((reds || []).map(r => r.buyer));
  const fund = prizeFund(statsFromTickets(tickets).total, rnd.price, rnd.payout_rate);
  const grossSum = Object.values(winners).reduce((a, w) => a + w.gross, 0);
  const rows = Object.entries(winners).sort((a, b) => b[1].gross - a[1].gross).map(([buyer, w]) => {
    const fee = redemptionFee(w.gross, w.isSponsor, todayISO(), rnd);
    const feeTxt = fee === null ? "期限を過ぎています（要相談）" : (fee === 0 ? `手数料なし → ${w.gross}D（=${w.gross}MM）渡す` : `手数料 ${fee}D → ${w.gross - fee}D（=${w.gross - fee}MM）渡す`);
    const state = redeemedBuyers.has(buyer) ? "渡した" : `<button onclick="doRedeem('${esc(buyer)}')">渡したことにする</button>`;
    return `<tr><td>${esc(buyer)}</td><td>${w.winTickets.join(", ")}</td><td>${w.gross}D（=${w.gross}MM）</td><td>${w.isSponsor ? "寄付・スポンサー" : "ふつう"}</td><td>${feeTxt}</td><td>${state}</td></tr>`;
  }).join("");
  h += `<div class="card"><h3>当選した人</h3><p class="hint">渡せる期間: 手数料なしは ${esc(rnd.redeem_free_until || "未設定")} まで ／ 手数料1割で ${esc(rnd.redeem_ext_until || "未設定")} まで ／ 寄付・スポンサーは ${esc(rnd.sponsor_redeem_until || "未設定")} まで手数料なし。渡すときは券の提示を受けること。</p><div class="scroll"><table><tr><th>当選した人</th><th>当たった番号</th><th>配当</th><th>区分</th><th>今日渡す場合</th><th>引換</th></tr>${rows}</table></div></div>`;
  h += `<div class="card"><h3>お金の内訳</h3><p>配当のもと（集まった金額 × ${rnd.payout_rate}%）: ${fund}D（=${fund}MM）／ 当選した人へ合計: ${grossSum}D（=${grossSum}MM）／ <b>余った ${fund - grossSum}D（=${fund - grossSum}MM）は Gate07 へ寄付</b></p><button class="sub" onclick="window._bookKind='winners';location.hash='#book'">当選発表の本を作る</button></div>`;
  if (reds && reds.length) h += `<div class="card"><h3>渡した記録</h3><div class="scroll"><table><tr><th>当選した人</th><th>配当</th><th>手数料</th><th>渡した額</th><th>担当</th></tr>${reds.map(r => `<tr><td>${esc(r.buyer)}</td><td>${r.gross}D（=${r.gross}MM）</td><td>${r.fee}D</td><td>${r.net}D（=${r.net}MM）</td><td>${esc(r.redeemed_by)}</td></tr>`).join("")}</table></div></div>`;
  $main.innerHTML = h;
}
async function doDraw() {
  if (!confirm("抽選します。いいですか？")) return;
  try {
    const {rnd} = await pickRound();
    const tickets = await fetchTickets(rnd.id);
    const {counts} = statsFromTickets(tickets);
    const sold = Object.keys(counts).map(Number).filter(n => counts[n] > 0);
    const win = drawNumbers(sold, rnd.win_count);
    const t = todayISO();
    const patch = {winning_numbers: win, drawn_at: new Date().toISOString(), drawn_by: profile.username, status: "drawn",
      redeem_free_until: rnd.redeem_free_until || addDays(t, 6),
      redeem_ext_until: rnd.redeem_ext_until || addDays(t, 20),
      sponsor_redeem_until: rnd.sponsor_redeem_until || addMonths(t, 1)};
    const {error} = await sb.from("rounds").update(patch).eq("id", rnd.id); if (error) throw error;
    await audit("draw", `round=${rnd.id} numbers=${win}`);
    viewWinners(`抽選しました: ${esc(formatWinning(win))}`);
  } catch (e) { viewWinners(esc(e.message), false); }
}
async function doDrawReset() {
  if (!confirm("抽選を取り消しますか？（配当を渡した人がいると取り消せません）")) return;
  try {
    const {rnd} = await pickRound();
    const {data: reds} = await sb.from("redemptions").select("id").eq("round_id", rnd.id);
    if (reds && reds.length) throw new Error("もう配当を渡した人がいるので取り消せません");
    const {error} = await sb.from("rounds").update({winning_numbers: [], drawn_at: null, drawn_by: "", status: "closed"}).eq("id", rnd.id); if (error) throw error;
    await audit("draw_reset", `round=${rnd.id}`);
    viewWinners("抽選を取り消しました");
  } catch (e) { viewWinners(esc(e.message), false); }
}
async function doRedeem(buyer) {
  try {
    const {rnd} = await pickRound();
    const tickets = await fetchTickets(rnd.id);
    const winners = computeWinners(tickets, rnd);
    const w = winners[buyer]; if (!w) throw new Error("当選した人ではありません");
    let fee = redemptionFee(w.gross, w.isSponsor, todayISO(), rnd);
    let note = "";
    if (fee === null) { fee = 0; note = "期限すぎ・特例で支払い"; }
    const {error} = await sb.from("redemptions").insert({round_id: rnd.id, buyer, gross: w.gross, fee, net: w.gross - fee, redeemed_by: profile.username, note});
    if (error) throw error;
    await audit("redeem", `buyer=${buyer} gross=${w.gross} fee=${fee} ${note}`);
    viewWinners(`${esc(buyer)} さんへ ${w.gross - fee}D（=${w.gross - fee}MM）渡したことにしました（手数料 ${fee}D）`);
  } catch (e) { viewWinners(esc(e.message), false); }
}

async function doTransfer() {
  try {
    const {rnd} = await pickRound();
    const from = document.getElementById("t_from").value.trim();
    const to = document.getElementById("t_to").value.trim();
    const num = document.getElementById("t_number").value.trim();
    if (!/^[A-Za-z0-9_]{3,32}$/.test(to)) throw new Error("新しい持ち主の Minecraft ID を入れてください");
    let q = sb.from("tickets").update({buyer: to}).eq("round_id", rnd.id).eq("buyer", from).eq("status", "valid");
    if (num) q = q.eq("number", parseInt(num, 10));
    const {data, error} = await q.select(); if (error) throw error;
    if (!data || !data.length) throw new Error("その人の券が見つかりませんでした");
    await audit("transfer", `round=${rnd.id} from=${from} to=${to} number=${num || "ALL"} count=${data.length}`);
    viewManage(`${esc(from)} さんから ${esc(to)} さんへ ${data.length} 枚の名義を変えました`);
  } catch (e) { viewManage(esc(e.message), false); }
}

// ---- Minecraftの本用テキスト ----
const BOOK_MAX_CHARS = 200, BOOK_MAX_LINES = 12;
function paginateBook(lines) {
  const pages = []; let cur = [], curLen = 0;
  const push = () => { if (cur.length) { pages.push(cur.join("\n")); cur = []; curLen = 0; } };
  for (let line of lines) {
    while (line.length > 38) { // 1行が長いときは折る
      if (cur.length >= BOOK_MAX_LINES) push();
      cur.push(line.slice(0, 38)); curLen += 39; line = line.slice(38);
      if (curLen > BOOK_MAX_CHARS) push();
    }
    if (cur.length >= BOOK_MAX_LINES || curLen + line.length + 1 > BOOK_MAX_CHARS) push();
    cur.push(line); curLen += line.length + 1;
  }
  push();
  return pages.length ? pages : [""];
}
function groupNums(nums, per = 4) {
  const out = [];
  for (let i = 0; i < nums.length; i += per) out.push(nums.slice(i, i + per).join(", "));
  return out;
}
function ticketBook(rnd, buyer, tickets) {
  const mine = tickets.filter(t => t.buyer === buyer && t.status === "valid");
  const nums = mine.map(t => t.number);
  const lines = ["節電鯖 宝くじ", rnd.name, "", "買った人:", buyer, "", `番号（${nums.length}枚）:`]
    .concat(groupNums(nums))
    .concat(["", `1枚 ${rnd.price} ダイヤ`, "当選した場合は", "この本を持参してください。", "", "なくさないでください"]);
  return {title: `宝くじ券 ${rnd.name}`.slice(0, 32), pages: paginateBook(lines)};
}
function winnersBook(rnd, tickets) {
  const winners = computeWinners(tickets, rnd);
  const lines = ["節電鯖 宝くじ", rnd.name, "当選発表 ", "", "当選番号:"]
    .concat(groupNums([...(rnd.winning_numbers || [])].sort((a, b) => a - b)))
    .concat(["", "当選した人:"]);
  const entries = Object.entries(winners).sort((a, b) => b[1].gross - a[1].gross);
  if (!entries.length) lines.push("（なし）");
  entries.forEach(([b, w]) => { lines.push(`${b}`); lines.push(` ${w.gross} ダイヤ`); });
  lines.push("", `引換は ${rnd.redeem_free_until || ""} まで`, "手数料なしです", "券の本を持ってきてね");
  return {title: `当選発表 ${rnd.name}`.slice(0, 32), pages: paginateBook(lines)};
}

  if (btn) { const old = btn.textContent; btn.textContent = "コピーした"; setTimeout(() => btn.textContent = old, 1500); }

function filterCandidates(filter) {
  if (!filter) return [...VALID_NUMBERS];
  if (filter === "even") return VALID_NUMBERS.filter(n => n % 2 === 0);
  if (filter === "odd") return VALID_NUMBERS.filter(n => n % 2 === 1);
  if (filter === "zoro") return VALID_NUMBERS.filter(n => Math.floor(n / 10) === n % 10);
  if (filter.startsWith("tail:")) { const d = parseInt(filter.slice(5), 10); return VALID_NUMBERS.filter(n => n % 10 === d); }
  if (filter.startsWith("tens:")) { const t = parseInt(filter.slice(5), 10); return VALID_NUMBERS.filter(n => Math.floor(n / 10) * 10 === t); }
  return null;
}
function pickOmakaseNumbers(counts, count, filter) {
  const cand = filterCandidates(filter);
  if (!cand) throw new Error(`未対応の条件です: ${filter}`);
  if (!cand.length) throw new Error("候補の番号がありません");
  if (filter && count > cand.length) throw new Error(`条件「${filter}」の候補は ${cand.length} 個しかなく、${count} 枚は選べません`);
  const picked = {}, out = [];
  for (let i = 0; i < count; i++) {
    const min = Math.min(...cand.map(n => (counts[n] || 0) + (picked[n] || 0)));
    const least = cand.filter(n => (counts[n] || 0) + (picked[n] || 0) === min);
    const n = least[secureRandomInt(least.length)];
    picked[n] = (picked[n] || 0) + 1; out.push(n);
  }
  return out.sort((a, b) => a - b);
}
async function execProposalSale(action) {
  const buyer = String(action.buyer || "").trim();
  if (!/^[A-Za-z0-9_]{3,32}$/.test(buyer)) throw new Error(`購入者のIDが不正です: ${buyer}`);
  const rounds = await fetchRounds(true);
  const rnd = rounds.find(r => ["preparing", "selling"].includes(r.status));
  if (!rnd) throw new Error("売れる回がありません（販売中の回なし）");
  let numbers;
  if (action.mode === "omakase") {
    const count = parseInt(action.count, 10);
    if (!count || count < 1 || count > 1000) throw new Error(`おまかせの枚数が不正です: ${action.count}`);
    const tickets = await fetchTickets(rnd.id, true);
    numbers = pickOmakaseNumbers(statsFromTickets(tickets).counts, count, action.filter || "");
  } else {
    numbers = (action.numbers || []).map(n => parseInt(n, 10));
    if (!numbers.length) throw new Error("番号がありません");
    if (numbers.some(n => !VALID_NUMBERS.includes(n))) throw new Error(`無効な番号が含まれています: ${numbers.join(", ")}`);
  }
  const source = ["face", "vending", "donation", "sponsor"].includes(action.source) ? action.source : "face";
  const rows = numbers.map(n => ({round_id: rnd.id, buyer, number: n, seller: profile.username, source, amount_paid: rnd.price}));
  const {error} = await sb.from("tickets").insert(rows); if (error) throw error;
  invalidateCache(rnd.id);
  return `${buyer} に ${numbers.join(", ")} の ${numbers.length} 枚を登録（${rnd.name}）`;
}
async function proposalBook(buyer) {
  const rounds = await fetchRounds();
  for (const r of rounds) {
    const tickets = await fetchTickets(r.id);
    if (tickets.some(t => t.buyer === buyer && t.status === "valid")) return ticketBook(r, buyer, tickets);
  }
  const {rnd} = await pickRound();
  if (!rnd) throw new Error("回がありません");
  return ticketBook(rnd, buyer, await fetchTickets(rnd.id));
}

async function doProposalApprove(id) {
  let claimed;
  try { claimed = await claimProposal(id); }
  catch (e) { return viewProposals(esc(e.message), false); }
  if (!claimed) return viewProposals("他の画面/modで処理済みです", false);
  const action = claimed.action || {};
  try {
    if (action.type === "register_sale") {
      const result = await execProposalSale(action);
      await finishProposal(id, "executed", result);
      await audit("proposal_execute", `proposal=${id} ${result}`);
      viewProposals(`実行しました: ${esc(result)}`);
    } else if (action.type === "fill_book") {
      const book = await proposalBook(String(action.buyer || ""));
      await finishProposal(id, "executed", "本を表示");
      await audit("proposal_execute", `proposal=${id} fill_book buyer=${action.buyer}`);
      await viewProposals(`${esc(action.buyer)} さんの券の本を表示しました`);
      showBookModal(book);
    } else if (action.type === "toast") {
      await finishProposal(id, "executed", `画面表示のみ: ${action.text || ""}`);
      await audit("proposal_execute", `proposal=${id} toast`);
      viewProposals(`表示のみの提案です: ${esc(action.text || "")}`);
    } else {
      await finishProposal(id, "failed", `未対応の提案です: ${action.type || "不明"}`);
      viewProposals("未対応の提案だったので、失敗として記録しました", false);
    }
  } catch (e) {
    try { await finishProposal(id, "failed", e.message); } catch {}
    viewProposals(`実行できませんでした: ${esc(e.message)}`, false);
  }
}

// ---- めうまねー (MM) 両替：自販機方式。レートは 1D = 1MM 固定 ----
const MM_KIND_JP = {issue: "発行（D→MM）", redeem: "還元（MM→D）", stock: "在庫操作", audit: "棚卸し"};
let mmDir = "issue"; // issue: ダイヤ→MM / redeem: MM→ダイヤ
let _mmCache = {machines: null, at: 0};
function invalidateMM() { _mmCache.machines = null; }
async function fetchMachines(force = false) {
  if (!force && _mmCache.machines && Date.now() - _mmCache.at < CACHE_MS) return _mmCache.machines;
  const {data, error} = await sb.from("mm_machines").select("*").order("id");
  if (error) throw error;
  _mmCache = {machines: data, at: Date.now()};
  return data;
}
// 集計（単体テスト対象）: exchanges は kind/mm_delta、machines は dia_stock を持つ行の配列
function mmSummary(exchanges, machines) {
  let issued = 0, redeemed = 0, auditAdj = 0;
  for (const e of exchanges) {
    if (e.kind === "issue") issued += -(e.mm_delta || 0);       // 発行 = 在庫から出たMM
    else if (e.kind === "redeem") redeemed += (e.mm_delta || 0); // 還元 = 在庫に戻ったMM
    else if (e.kind === "audit") auditAdj += -(e.mm_delta || 0); // 棚卸し差分 = 在庫から出た分は流通側に出たものとして補正
  }
  const circulating = issued - redeemed + auditAdj;
  const backing = (machines || []).reduce((a, mc) => a + (mc.dia_stock || 0), 0);
  return {issued, redeemed, circulating, backing, balanced: circulating === backing};
}
function mmExchangeCheck(kind, machine, n) { // 両替の事前チェック。エラー文字列 or null
  if (!machine) return "自販機を選んでください";
  if (!machine.active) return "この自販機は停止中です";
  if (!Number.isInteger(n) || n < 1) return "個数は1以上の整数で入れてください";
  if (kind === "issue" && machine.mm_stock < n) return `MM在庫が足りません（いま ${machine.mm_stock} MM）`;
  if (kind === "redeem" && machine.dia_stock < n) return `ダイヤ在庫が足りません（いま ${machine.dia_stock} D）`;
  return null;
}
function mmStockCheck(machine, field, delta) { // 在庫操作でマイナスにならないか
  if (!machine) return "自販機が見つかりません";
  return (machine[field] || 0) + delta < 0 ? "在庫がマイナスになってしまいます" : null;
}
const fmtDelta = (v, unit) => v > 0 ? `+${v}${unit}` : v < 0 ? `${v}${unit}` : `±0${unit}`;
// ---- MM資産管理: 棚卸し・大口の2人チェック・公開スナップショット ----
const MM_BIG_THRESHOLD = 100; // |dia_delta| と |mm_delta| の大きい方がこれ以上なら確認者が必須
function mmNeedsConfirmer(diaDelta, mmDelta) { // 大口判定（単体テスト対象）
  return Math.max(Math.abs(diaDelta || 0), Math.abs(mmDelta || 0)) >= MM_BIG_THRESHOLD;
}
function mmConfirmerCheck(need, confirmer, selfName) { // 確認者チェック（単体テスト対象）。エラー文字列 or null
  // これは手続き上の統制であり、確認者本人のログインは伴わない（記録に名前を残すだけ）。
  if (!need) return null;
  if (!confirmer) return "大口（100以上）の操作のため確認者が必要です。確認者を選んでください";
  if (confirmer === selfName) return "確認者は自分以外を選んでください";
  return null;
}
function mmAuditDiffs(machine, actualDia, actualMm) { // 棚卸し差分（単体テスト対象）: {diaDelta, mmDelta} か {error}
  if (!machine) return {error: "自販機が見つかりません"};
  if (!Number.isInteger(actualDia) || actualDia < 0) return {error: "ダイヤの実数は0以上の整数で入れてください"};
  if (!Number.isInteger(actualMm) || actualMm < 0) return {error: "MMの実数は0以上の整数で入れてください"};
  return {diaDelta: actualDia - (machine.dia_stock || 0), mmDelta: actualMm - (machine.mm_stock || 0)};
}
function mmPublicText(snap) { // Wiki 等に貼る公開用テキスト（単体テスト対象）。個人名は含めない

// ---- MM台帳ハッシュチェーン (MMCHAINv1) ----
// record_hash = SHA-256("MMCHAINv1|{chain_seq}|{prev_hash}|{machine_id}|{kind}|{player}|{dia_delta}|{mm_delta}|{seller}|{note}")
// 先頭行の prev_hash は "GENESIS-MM"。mm_exchanges への挿入は必ず insertMMExchange 経由にすること（オフライン引き継ぎツール mm-tool.html と同一仕様）。
const MM_GENESIS = "GENESIS-MM";
function mmChainString(r) {
  return ["MMCHAINv1", r.chain_seq, r.prev_hash ?? "", String(r.machine_id ?? ""), r.kind ?? "", r.player ?? "", r.dia_delta, r.mm_delta, r.seller ?? "", r.note ?? ""].join("|");
}
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function verifyMMChain(rows) { // rows は chain_seq 昇順。{ok:true,count,head} か {ok:false,atSeq,why}
  let prev = MM_GENESIS;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.chain_seq !== i + 1) return {ok: false, atSeq: r.chain_seq, why: "連番が飛んでいます"};
    if (r.prev_hash !== prev) return {ok: false, atSeq: r.chain_seq, why: "前のレコードとつながっていません"};
    if (await sha256Hex(mmChainString(r)) !== r.record_hash) return {ok: false, atSeq: r.chain_seq, why: "ハッシュが合いません（書き換えられた可能性）"};
    prev = r.record_hash;
  }
  return {ok: true, count: rows.length, head: rows.length ? rows[rows.length - 1].record_hash : ""};
}
async function fetchMMChain() { // キャッシュを使わず全件取得: {chained: chain_seq 昇順, prechain: チェーン開始前の行}
  const chained = [], PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const {data, error} = await sb.from("mm_exchanges").select("*").not("chain_seq", "is", null).order("chain_seq", {ascending: true}).range(from, from + PAGE - 1);
    if (error) throw error;
    chained.push(...data);
    if (data.length < PAGE) break;
  }
  const {data: pre, error: e2} = await sb.from("mm_exchanges").select("*").is("chain_seq", null).order("id", {ascending: true});
  if (e2) throw e2;
  return {chained, prechain: pre || []};
}
async function insertMMExchange(mc, kind, player, diaDelta, mmDelta, note) { // チェーンを延ばして1件挿入する唯一の入口
  const base = {machine_id: mc.id, seller: profile.username, kind, player: player || null, dia_delta: diaDelta, mm_delta: mmDelta, note: note ?? ""};
  for (let attempt = 0; attempt < 2; attempt++) {
    const {data: latest, error: e1} = await sb.from("mm_exchanges").select("chain_seq, record_hash").not("chain_seq", "is", null).order("chain_seq", {ascending: false}).limit(1);
    if (e1) throw e1;
    const rec = {...base, chain_seq: latest && latest.length ? latest[0].chain_seq + 1 : 1, prev_hash: latest && latest.length ? latest[0].record_hash : MM_GENESIS, record_hash: ""};
    rec.record_hash = await sha256Hex(mmChainString(rec));
    const {error} = await sb.from("mm_exchanges").insert(rec);
    if (!error) return rec;
    if (!(error.code === "23505" || /duplicate|unique/i.test(error.message || "")) || attempt === 1) throw error; // 連番が競合したら再取得して1回だけ再試行
  }
}

async function applyMMExchange(mc, kind, player, diaDelta, mmDelta, note) { // 記録して在庫を更新する共通処理
  await insertMMExchange(mc, kind, player, diaDelta, mmDelta, note);
  const {error: e2} = await sb.from("mm_machines").update({dia_stock: (mc.dia_stock || 0) + diaDelta, mm_stock: (mc.mm_stock || 0) + mmDelta}).eq("id", mc.id);
  if (e2) throw e2;

}
async function exportMMLedger() { // 台帳全体を JSON でダウンロード（引き継ぎ用）
  try {
    const machines = await fetchMachines(true);
    const {chained, prechain} = await fetchMMChain();
    const payload = {
      format: "mm-ledger-export-v1",
      exported_at: new Date().toISOString(),
      head_hash: chained.length ? chained[chained.length - 1].record_hash : "",
      machines,
      exchanges: [...chained, ...prechain]
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mm-ledger-${ymd}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert("エクスポートできませんでした: " + e.message); }
}
async function doMMExchange() {

    await audit("mm_exchange", `machine=${mc.id} kind=${mmDir} player=${player} n=${n} confirmer=${confirmer || "-"}`);
    viewMM(mmDir === "issue" ? `${esc(player)} さん: ${n}D → ${n}MM を渡しました（${esc(mc.name)}）` : `${esc(player)} さん: ${n}MM → ${n}D を渡しました（${esc(mc.name)}）`);

async function doMMStock(id, field, sign) {

    const machines = await fetchMachines(true);
    const mc = machines.find(x => x.id === id);

    const err = mmStockCheck(mc, field, delta); if (err) throw new Error(err);
    const diaDelta = field === "dia_stock" ? delta : 0, mmDelta = field === "mm_stock" ? delta : 0;
    const confirmer = window._mmStockConfirmer || "";

    const label = (field === "dia_stock" ? "ダイヤ" : "MM") + (sign > 0 ? "補充" : "回収");
    await applyMMExchange(mc, "stock", null, diaDelta, mmDelta, `在庫操作: ${label}` + (confirmer ? ` 確認:${confirmer}` : ""));
    await audit("mm_stock", `machine=${id} ${label} ${n} confirmer=${confirmer || "-"}`);
    viewMM(`${esc(mc.name)}: ${label} ${n} しました`);
  } catch (e) { viewMM(esc(e.message), false); }
}

async function doMMAuditPrepare(id) { // 棚卸し: 実数を入れて差分を確認画面に出す

    const num = elId => { const v = (document.getElementById(elId)?.value ?? "").trim(); return v === "" ? NaN : Number(v); };

    window._mmAudit = {machineId: id, name: mc.name, diaStock: mc.dia_stock || 0, mmStock: mc.mm_stock || 0, actualDia, actualMm, diaDelta: d.diaDelta, mmDelta: d.mmDelta, witness, confirmer};

}
async function doMMAuditExecute() { // 棚卸し: 差分をチェーンに記録して在庫を実数に合わせる
  const p = window._mmAudit;
  if (!p) return viewMM();
  try {
    const machines = await fetchMachines(true);
    const mc = machines.find(x => x.id === p.machineId);
    const d = mmAuditDiffs(mc, p.actualDia, p.actualMm); if (d.error) throw new Error(d.error); // 準備後に在庫が動いていたら差分を取り直す
    let note = `棚卸し 実数D${p.actualDia}/MM${p.actualMm}`;
    if (p.witness) note += ` 立会:${p.witness}`;
    if (p.confirmer) note += ` 確認:${p.confirmer}`;
    await applyMMExchange(mc, "audit", null, d.diaDelta, d.mmDelta, note);
    await audit("mm_audit", `machine=${mc.id} actual_dia=${p.actualDia} actual_mm=${p.actualMm} diff_dia=${d.diaDelta} diff_mm=${d.mmDelta} witness=${p.witness || "-"} confirmer=${p.confirmer || "-"}`);
    window._mmAudit = null;
    viewMM(`${esc(mc.name)} の棚卸しを記録しました（在庫を実数に合わせました）`);
  } catch (e) { window._mmAudit = null; viewMM(esc(e.message), false); }
}

      ? `${player} さんから現物 ${n}MM を受け取り、残高に ${n}MM を入れます。よろしいですか？`
      : `${player} さんの残高から ${n}MM を減らし、現物 ${n}MM を渡します。よろしいですか？`;
    if (!confirm(text)) return;
    const args = kind === "deposit"
      ? {p_from: "OPERATOR", p_to: player, p_amount: n, p_kind: "deposit", p_note: note}
      : {p_from: player, p_to: "OPERATOR", p_amount: n, p_kind: "withdraw", p_note: note};
    const {data, error} = await sb.rpc("mm_operator_transfer", args);
    if (error) throw new Error(error.message);
    if (!data?.ok) throw new Error(MMT_ERR_JP[data?.error] || `エラー: ${data?.error || "不明"}`);
    await audit(kind === "deposit" ? "mm_deposit" : "mm_withdraw", `player=${player} amount=${n} note=${note}`);
    viewMM(kind === "deposit" ? `${esc(player)} さんの残高に ${n}MM を預かりました` : `${esc(player)} さんに ${n}MM を払い戻しました`);
  } catch (e) { viewMM(esc(e.message), false); }
}

// ---- めうまねー (MM) 個人間取引・送金 ----
// 本人確認は MCID + PIN を RPC (mm_*) に渡す方式。PIN はメモリ内だけに保持し、ストレージには保存しない。
// 送金台帳 mm_transfers は公開され、自前のハッシュチェーン MMTCHAINv1 を持つ。
// record_hash = SHA-256("MMTCHAINv1|{chain_seq}|{prev_hash}|{from_player}|{to_player}|{amount}|{kind}|{offer_id or ''}|{note}")、先頭行の prev_hash は "GENESIS-MMT"。
const MMT_GENESIS = "GENESIS-MMT";
const MMT_ERR_JP = {
  locked: "試行が多すぎます。時間をおいてから試してください",
  not_registered: "まだ登録がありません",
  bad_pin: "暗証番号が違います",
  bad_pin_format: "暗証番号は数字4〜8桁で入力してください",
  bad_mcid: "IDの形式が違います",
  already_registered: "そのIDは登録ずみです",
  insufficient: "残高が足りません",
  not_open: "もう終わった取引です",
  own_offer: "自分の出品です",
  own_account: "自分には送れません",
  recipient_not_registered: "相手が未登録です",
  bad_input: "入力が違います",
  not_member: "権限がありません"
};
const MMT_KIND_JP = {send: "送金", trade: "取引", deposit: "預かり", withdraw: "払い戻し"};
let tradePlayer = null;      // ログイン中だけ {mcid, pin} を保持する (PIN はメモリのみ)
let tradeFocusId = null;     // #trade-<uuid> で開いたときの対象出品
let tradeSideFilter = "all"; // 掲示板の絞り込み: all | sell | buy
let tradeOfferSide = "sell"; // 出品フォームの向き: sell | buy
// 本人確認 (認証サーバー方式): プレイヤーが専用の認証サーバーに参加し、チャットでコードを発言すると確認できる。
const VERIFY_SERVER = "";    // 認証サーバーのアドレス (例: verify.example.com)。未設定なら空のまま
let tradeVerify = null;      // ログイン後に1回だけ判定する {verified, uuid}。null は未判定
let tradeVerifiedSet = new Set(); // mm_public_players で本人確認ずみの MCID 集合 (掲示板の表示用)
let verifySession = null;    // 発行中の確認コード {code, expiresAt}
let verifyTimer = null;      // 状態確認ポーリングのタイマー
function mmtChainString(r) {
  return ["MMTCHAINv1", r.chain_seq, r.prev_hash ?? "", r.from_player ?? "", r.to_player ?? "", r.amount, r.kind ?? "", r.offer_id ?? "", r.note ?? ""].join("|");
}
function mmtBalanceOf(transfers, mcid) { // 残高 = その人への入金合計 - 出金合計 (単体テスト対象)
  let b = 0;
  for (const t of transfers) { if (t.to_player === mcid) b += t.amount || 0; if (t.from_player === mcid) b -= t.amount || 0; }
  return b;
}
async function verifyMMTChain(rows) { // rows は chain_seq 昇順。{ok:true,count,head} か {ok:false,atSeq,why}
  let prev = MMT_GENESIS;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.chain_seq !== i + 1) return {ok: false, atSeq: r.chain_seq, why: "連番が飛んでいます"};
    if (r.prev_hash !== prev) return {ok: false, atSeq: r.chain_seq, why: "前のレコードとつながっていません"};
    if (await sha256Hex(mmtChainString(r)) !== r.record_hash) return {ok: false, atSeq: r.chain_seq, why: "ハッシュが合いません (書き換えられた可能性)"};
    prev = r.record_hash;
  }
  return {ok: true, count: rows.length, head: rows.length ? rows[rows.length - 1].record_hash : ""};
}
async function fetchMMTransfers() { // 送金台帳を全件取得 (id 昇順)。残高・履歴・チェーン検証に使う
  const all = [], PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const {data, error} = await sb.from("mm_transfers").select("*").order("id", {ascending: true}).range(from, from + PAGE - 1);
    if (error) throw error;
    all.push(...data);
    if (data.length < PAGE) break;
  }
  return all;
}
async function mmRpc(name, args) { // RPC の戻り値 jsonb をそのまま返す。通信エラーだけ throw する
  const {data, error} = await sb.rpc(name, args);
  if (error) throw new Error(error.message);
  return data;
}
function mmtErrText(code) { return MMT_ERR_JP[code] || `エラーが発生しました (${code || "不明"})`; }
function tradeOfferCard(o, focus = false) {
  const sideLabel = o.side === "sell" ? "売りたい" : "買いたい";
  const link = `${location.origin}${location.pathname}#trade-${o.id}`;

    <div style="font-size:${focus ? 22 : 17}px;margin:4px 0"><b>${esc(o.item)}</b> × ${o.qty}　<b>${o.price_mm} MM</b></div>
    <div class="small">出品者: ${esc(o.poster)}${tradeVerifiedSet.has(o.poster) ? " (確認ずみ)" : ""}${o.note ? `<br>メモ: ${esc(o.note)}` : ""}</div>
    <p style="margin:8px 0 0"><button type="button" class="sub" onclick="copyBookText('${link}', this)">リンクをコピー</button>
    ${focus ? "" : `<button type="button" class="sub" onclick="location.hash='trade-${o.id}'">取引する</button>`}</p></div>`;
}
async function viewTrade(m = "", ok = true) {
  let offers = [], focus = null, transfers = [], chainRes = null, myOffers = [];
  try {
    const [offRes, tr] = await Promise.all([
      sb.from("mm_offers").select("*").eq("status", "open").order("created_at", {ascending: false}).limit(100),
      fetchMMTransfers()
    ]);
    if (offRes.error) throw offRes.error;
    offers = offRes.data || [];
    transfers = tr;
    chainRes = await verifyMMTChain(transfers.filter(t => t.chain_seq != null).sort((a, b) => a.chain_seq - b.chain_seq));
    if (tradeFocusId) {
      const {data} = await sb.from("mm_offers").select("*").eq("id", tradeFocusId).single();
      focus = data || null;
    }
    if (tradePlayer) {

    }
    try { // 本人確認ずみプレイヤーの集合 (取得できない環境では表示だけ落とす)
      const {data} = await sb.from("mm_public_players").select("mcid, verified");
      tradeVerifiedSet = new Set((data || []).filter(r => r.verified).map(r => r.mcid));
    } catch (e) { /* ビューが無い場合は空のまま */ }
    if (tradePlayer && tradeVerify === null) { // ログイン後に1回だけ本人確認の状態を判定する
      try {
        const st = await mmRpc("mm_verify_status", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin});
        tradeVerify = {verified: !!(st && st.ok && st.verified), uuid: (st && st.uuid) || ""};

  } catch (e) {
    $main.innerHTML = msg(m, ok) + `<div class="card"><h2>MM取引</h2><p class="err">読み込めませんでした: ${esc(e.message)}</p><p class="hint">取引テーブル (mm_offers / mm_transfers) がまだ用意されていない可能性があります。</p></div>`;

  }
  const me = tradePlayer;
  const balance = me ? mmtBalanceOf(transfers, me.mcid) : 0;
  let h = msg(m, ok) + `<h2>MM取引 (めうまねー)</h2>
  <p class="hint">プレイヤー同士で MM を送金したり、アイテム取引の代金を MM で決済したりするためのページです。アイテムの受け渡しはゲーム内で行い、MM の支払いだけがここで確定します。出品のリンクを Discord などに貼って使うことを想定しています。</p>`;
  // リンクから開いた出品の詳細
  if (tradeFocusId) {

    if (!focus) h += `<p class="err">指定された出品は見つかりません。</p>`;
    else {
      h += tradeOfferCard(focus, true);
      if (focus.status === "open") {
        h += focus.side === "sell"
          ? `<p class="hint">${esc(focus.poster)} さんが売っている出品です。取引すると、あなたから ${esc(focus.poster)} さんへ ${focus.price_mm}MM が送金されます。アイテムはゲーム内で受け取ってください。</p>`
          : `<p class="hint">${esc(focus.poster)} さんが買いたがっている出品です。取引すると、${esc(focus.poster)} さんからあなたへ ${focus.price_mm}MM が送金されます。アイテムはゲーム内で渡してください。</p>`;
        h += me
          ? (focus.poster === me.mcid
            ? `<p class="hint">これは自分の出品です。</p>`
            : `<p><button type="button" onclick="doTradeAccept('${focus.id}')">この内容で取引する (${focus.price_mm}MM)</button></p>`)
          : `<p class="hint">取引するには、下のプレイヤー情報で登録・ログインしてください。</p>`;
      } else h += `<p class="hint">この出品は${focus.status === "done" ? "取引成立ずみ" : "取り消しずみ"}です${focus.partner ? ` (相手: ${esc(focus.partner)})` : ""}。</p>`;
    }
    h += `<p><a href="#trade">掲示板にもどる</a></p></div>`;
  }
  // プレイヤーパネル
  h += `<div class="card"><h3>プレイヤー情報</h3>`;
  if (!me) {
    h += `<label class="f">Minecraft ID</label><input id="tp_mcid" maxlength="16" placeholder="例: Steve_123" value="${esc(localStorage.getItem("mm_trade_mcid") || "")}">
    <label class="f">暗証番号 (数字4〜8桁)</label><input id="tp_pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <p><button type="button" onclick="doTradeLogin()">ログイン</button>

  } else {
    h += `<p><b>${esc(me.mcid)}</b>　残高: <b>${balance} MM</b>　<button type="button" class="sub" onclick="doTradeLogout()">ログアウト</button></p>`;
    // 本人確認 (認証サーバー方式)
    h += `<h3 style="margin-top:16px">本人確認</h3>`;
    if (tradeVerify && tradeVerify.verified) {
      h += `<p>本人確認ずみ (UUID: ${esc((tradeVerify.uuid || "").slice(0, 8))}…)</p>`;
    } else if (verifySession && verifySession.expiresAt > Date.now()) {
      h += `<p class="hint">認証サーバーに参加し、チャットで次のコードを発言してください。</p>
      <p style="font-size:28px;letter-spacing:4px;margin:8px 0"><b>${esc(verifySession.code)}</b></p>
      <p>認証サーバー: ${VERIFY_SERVER ? esc(VERIFY_SERVER) : "アドレスは運営に確認してください"}</p>

    } else {

    }
    h += `
    <h3 style="margin-top:16px">送金</h3>

    <label class="f">個数</label><input id="tp_qty" type="number" min="1" value="1">
    <label class="f">合計価格 (MM)</label><input id="tp_price" type="number" min="1" value="10">
    <label class="f">メモ (任意)</label><input id="tp_onote" maxlength="200" placeholder="例: 取引板で声をかけてください">
    <p><button type="button" onclick="doTradeCreateOffer()">出品する</button></p>
    <p class="hint">${tradeOfferSide === "buy" ? "「買いたい」出品には残高が必要です (支払いは取引成立時に行われます)。" : "「売りたい」出品は、相手が取引した時点で代金が残高に入ります。"}</p>
    <h3 style="margin-top:16px">自分の出品</h3>`;
    if (!myOffers.length) h += `<p class="hint">まだありません。</p>`;
    else h += myOffers.map(o => `<div style="border:1px solid var(--line2);border-radius:12px;padding:10px;margin:8px 0">
      <b>${o.side === "sell" ? "売りたい" : "買いたい"}</b> ${esc(o.item)} × ${o.qty}　<b>${o.price_mm} MM</b>
      <span class="small">${o.status === "open" ? "受付中" : o.status === "done" ? `成立 (相手: ${esc(o.partner)})` : "取り消し"} ／ ${fmtTime(o.created_at)}</span>
      ${o.status === "open" ? `<p style="margin:6px 0 0"><button type="button" class="sub" onclick="copyBookText('${location.origin}${location.pathname}#trade-${o.id}', this)">リンクをコピー</button> <button type="button" class="sub" onclick="doTradeCancel('${o.id}')">取り消す</button></p>` : ""}</div>`).join("");
    const mine = transfers.filter(t => t.from_player === me.mcid || t.to_player === me.mcid).slice(-20).reverse();
    h += `<h3 style="margin-top:16px">自分の取引履歴 (直近20件)</h3>`;
    if (!mine.length) h += `<p class="hint">まだありません。</p>`;

      return `<tr><td>${fmtTime(t.created_at)}</td><td>${MMT_KIND_JP[t.kind] || esc(t.kind)}</td><td>${esc(other)}</td><td>${inTx ? "+" : "-"}${t.amount} MM</td><td>${esc(t.note)}</td></tr>`;
    }).join("")}</table></div>`;
  }

  h += `<div class="card"><h3>取引掲示板 (受付中 ${offers.length} 件)</h3>

  if (!shown.length) h += `<p class="hint">表示する出品がありません。</p>`;
  else h += shown.map(o => tradeOfferCard(o)).join("");

function tradeCredentials() { // プレイヤーパネルの入力を読む。{mcid, pin} か null (呼び出し側でエラー表示)
  const mcid = (document.getElementById("tp_mcid")?.value || "").trim();

  return {mcid, pin};
}
async function doTradeRegister() {
  try {
    const {mcid, pin} = tradeCredentials();
    const data = await mmRpc("mm_register_player", {p_mcid: mcid, p_pin: pin});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    const login = await mmRpc("mm_login", {p_mcid: mcid, p_pin: pin});
    if (!login?.ok) return viewTrade("登録しました。ログインしてください。", true);
    tradePlayer = {mcid, pin};
    localStorage.setItem("mm_trade_mcid", mcid);
    viewTrade(`登録とログインが完了しました。残高は ${login.balance ?? 0}MM です。`);
  } catch (e) { viewTrade(esc(e.message), false); }
}
async function doTradeLogin() {
  try {
    const {mcid, pin} = tradeCredentials();
    const data = await mmRpc("mm_login", {p_mcid: mcid, p_pin: pin});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    tradePlayer = {mcid, pin};
    localStorage.setItem("mm_trade_mcid", mcid);
    viewTrade(`ログインしました。残高は ${data.balance ?? 0}MM です。`);
  } catch (e) { viewTrade(esc(e.message), false); }
}
function doTradeLogout() {
  stopVerifyPolling();
  verifySession = null;
  tradeVerify = null;
  tradePlayer = null;
  viewTrade("ログアウトしました。");
}
// ---- 本人確認 (認証サーバー方式) ----
async function doTradeVerifyStart() {
  if (!tradePlayer) return viewTrade("先にログインしてください。", false);
  try {
    const data = await mmRpc("mm_verify_start", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    verifySession = {code: data.code, expiresAt: Date.now() + (data.expires_in_sec || 600) * 1000};
    viewTrade("確認コードを発行しました。");
  } catch (e) { viewTrade(esc(e.message), false); }
}
function startVerifyPolling() {
  stopVerifyPolling();
  verifyTimer = setInterval(verifyPollTick, 5000);
}
function stopVerifyPolling() {
  if (verifyTimer) { clearInterval(verifyTimer); verifyTimer = null; }
}
async function verifyPollTick() {
  if (!verifySession || !tradePlayer || !(location.hash || "").startsWith("#trade")) { stopVerifyPolling(); return; }
  const el = document.getElementById("verify_status");
  if (Date.now() > verifySession.expiresAt) {
    stopVerifyPolling();
    verifySession = null;
    if (el) el.textContent = "有効時間が切れました。もう一度発行してください。";
    return;
  }
  if (el) el.textContent = `確認待ちです (残り約${Math.max(1, Math.ceil((verifySession.expiresAt - Date.now()) / 60000))}分)。`;
  try {
    const st = await mmRpc("mm_verify_status", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin});
    if (st?.ok && st.verified) {
      stopVerifyPolling();
      verifySession = null;
      tradeVerify = {verified: true, uuid: st.uuid || ""};
      viewTrade("本人確認が完了しました。");
    }
  } catch (e) { /* 一時的な通信エラーは無視して次の回で再確認する */ }
}
async function doTradeSend() {
  if (!tradePlayer) return viewTrade("先にログインしてください。", false);
  try {
    const to = (document.getElementById("tp_to")?.value || "").trim();
    const amount = parseInt(document.getElementById("tp_amount")?.value, 10);
    const note = (document.getElementById("tp_note")?.value || "").trim();
    if (!Number.isInteger(amount) || amount < 1) throw new Error("金額は1以上の整数で入力してください");
    if (!confirm(`${to} へ ${amount}MM を送金します。よろしいですか？`)) return;
    const data = await mmRpc("mm_send", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin, p_to: to, p_amount: amount, p_note: note});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    viewTrade(`${esc(to)} へ ${amount}MM を送金しました。残高は ${data.balance ?? ""}MM です。`);
  } catch (e) { viewTrade(esc(e.message), false); }
}
async function doTradeCreateOffer() {
  if (!tradePlayer) return viewTrade("先にログインしてください。", false);
  try {
    const item = (document.getElementById("tp_item")?.value || "").trim();
    const qty = parseInt(document.getElementById("tp_qty")?.value, 10);
    const price = parseInt(document.getElementById("tp_price")?.value, 10);
    const note = (document.getElementById("tp_onote")?.value || "").trim();
    const data = await mmRpc("mm_create_offer", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin, p_side: tradeOfferSide, p_item: item, p_qty: qty, p_price: price, p_note: note});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    tradeFocusId = data.id;
    viewTrade("出品しました。リンクを Discord などに貼って使ってください。");
  } catch (e) { viewTrade(esc(e.message), false); }
}
async function doTradeAccept(id) {
  if (!tradePlayer) return viewTrade("先にログインしてください。", false);
  try {
    const {data: o} = await sb.from("mm_offers").select("*").eq("id", id).single();
    if (!o || o.status !== "open") return viewTrade("もう終わった取引です", false);
    const text = o.side === "sell"
      ? `${o.poster} の「${o.item} ×${o.qty}」を ${o.price_mm}MM で買います。支払いが確定します。アイテムはゲーム内で受け取ってください。実行しますか？`
      : `${o.poster} に「${o.item} ×${o.qty}」を売ります。${o.price_mm}MM が残高に入ります。アイテムはゲーム内で渡してください。実行しますか？`;
    if (!confirm(text)) return;
    const data = await mmRpc("mm_accept_offer", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin, p_offer: id});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    viewTrade(`取引が成立しました。${esc(data.from)} から ${esc(data.to)} へ ${data.amount}MM が送金されました。`);
  } catch (e) { viewTrade(esc(e.message), false); }
}
async function doTradeCancel(id) {
  if (!tradePlayer) return viewTrade("先にログインしてください。", false);
  try {
    if (!confirm("この出品を取り消します。よろしいですか？")) return;
    const data = await mmRpc("mm_cancel_offer", {p_mcid: tradePlayer.mcid, p_pin: tradePlayer.pin, p_offer: id});
    if (!data?.ok) return viewTrade(mmtErrText(data?.error), false);
    if (tradeFocusId === id) tradeFocusId = null;
    viewTrade("出品を取り消しました。");
  } catch (e) { viewTrade(esc(e.message), false); }
}

// ---- その他メニュー（スマホ用） ----
function viewMore() {
  const item = (hash, label, desc) => `<a href="#${hash}" style="display:block;color:var(--txt);text-decoration:none;padding:14px 4px;border-bottom:1px solid var(--line2)"><b>${label}</b><br><span class="small">${desc}</span></a>`;
  $main.innerHTML = `<div class="card"><h2>その他</h2>
  ${item("numbers", "番号一覧", "番号ごとの買った人と配当")}
  ${item("donations", "寄付", "寄付の受付と残り枚数")}
  ${item("manage", "券の管理", "無効化と譲渡")}
  ${item("mm", "MM両替", "めうまねー (MM) の発行・還元と自販機の在庫")}
  ${item("trade", "MM取引", "プレイヤー同士の MM 送金とアイテム取引の掲示板")}
  ${item("public", "みんなの実績", "公開ページを見る")}
  ${profile.role === "admin" ? item("rounds", "回・設定", "回の作成と状態変更") + item("users", "販売員", "有効化と役割") + item("audit", "記録", "操作ログ") : ""}
  </div>`;
}

// ---- ルータ ----
async function render() {
  const rawHash = (location.hash || "#public").slice(1);
  const hash = rawHash.startsWith("trade-") ? "trade" : rawHash;
  tradeFocusId = rawHash.startsWith("trade-") ? rawHash.slice(6) : null;
  renderNav(); renderTabbar();
  if (!session && !["public", "claim", "login", "register", "trade"].includes(hash)) { location.hash = "#public"; return; }
  if (session && profile && !profile.active && !["public", "claim", "trade"].includes(hash)) {
    $main.innerHTML = `<div class="card"><h2>有効化待ち</h2><p>アカウント「${esc(profile.username)}」は、まだ管理者に有効化されていません。</p></div>`;
    return;
  }
  switch (hash) {
    case "public": return viewPublic();
    case "claim": return viewClaim();
    case "login": return session ? viewApp() : viewLogin();
    case "register": return viewRegister();
    case "app": return viewApp();
    case "sell": return viewSell();
    case "lots": return viewLots();
    case "donations": return viewDonations();
    case "numbers": return viewNumbers();
    case "winners": return viewWinners();
    case "manage": return viewManage();
    case "book": return viewBook();
    case "proposals": return viewProposals();
    case "mm": return viewMM();
    case "trade": return viewTrade();
    case "more": return viewMore();
    case "rounds": return profile?.role === "admin" ? viewRounds() : viewApp();
    case "users": return profile?.role === "admin" ? viewUsers() : viewApp();
    case "audit": return profile?.role === "admin" ? viewAudit() : viewApp();
    default: return viewPublic();
  }
}
window.addEventListener("hashchange", render);
(async () => {
  const {data} = await sb.auth.getSession();
  session = data.session;
  await loadProfile();
  render();
})();
</script>
