var ITER = 600000;
function ub64(s) { var bin = atob(s); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function b64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function deriveKey(pw, salt, iter) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function decryptApp(pw) {
  var blob = JSON.parse(BLOB_JSON);
  var key = await deriveKey(pw, ub64(blob.salt), blob.iter);
  var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(blob.iv) }, key, ub64(blob.ct));
  return new TextDecoder().decode(pt);
}
function setMsg(text, cls) { var m = document.getElementById("msg"); m.textContent = text; m.className = "msg " + (cls || ""); }
async function openApp() {
  var pw = document.getElementById("pw").value;
  if (!pw) { setMsg("パスワードを入力してください", "err"); return; }
  setMsg("解除中…（数秒かかることがあります）");
  try {
    var html = await decryptApp(pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    setMsg("パスワードが違うか、ファイルが壊れています", "err");
  }
}
document.getElementById("btnOpen").addEventListener("click", openApp);
document.getElementById("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") openApp(); });
document.getElementById("btnChange").addEventListener("click", async function () {
  var cur = document.getElementById("pw").value;
  var n1 = document.getElementById("pwNew").value;
  var n2 = document.getElementById("pwNew2").value;
  if (!cur) { setMsg("まず現在のパスワードを上の欄に入れてください", "err"); return; }
  if (!n1 || n1 !== n2) { setMsg("新しいパスワードが一致しません", "err"); return; }
  if (n1.length < 8) { setMsg("新しいパスワードは8文字以上にしてください", "err"); return; }
  setMsg("変更用ファイルを生成中…");
  try {
    var html = await decryptApp(cur);
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(n1, salt, ITER);
    var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(html));
    var blob = JSON.stringify({ v: 1, iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) });
    var src = "<!DOCTYPE html>
" + document.documentElement.outerHTML;
    var out = src.split(BLOB_JSON).join(JSON.stringify(blob));
    if (out === src) { setMsg("置換に失敗しました", "err"); return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    a.download = "register.html";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    setMsg("変更用ファイルをダウンロードしました", "ok");
  } catch (e) {
    setMsg("現在のパスワードが違います", "err");
  }
});
</script>
